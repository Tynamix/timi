name: Verify and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR checks can stop; publishing a release must finish atomically.
concurrency:
  group: verify-and-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Release macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - name: Validate signing inputs
        id: signing-inputs
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MACOS_CERTIFICATE_P12_BASE64:?Missing MACOS_CERTIFICATE_P12_BASE64 secret}"
          : "${MACOS_CERTIFICATE_PASSWORD:?Missing MACOS_CERTIFICATE_PASSWORD secret}"
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
          umask 077
          certificate="$RUNNER_TEMP/timi-signing.p12"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          echo "keychain-password=$keychain_password" >> "$GITHUB_OUTPUT"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v6
        with:
          keychain: ${{ runner.temp }}/timi-signing
          keychain-password: ${{ steps.signing-inputs.outputs.keychain-password }}
          p12-filepath: ${{ runner.temp }}/timi-signing.p12
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Verify signing and prepare notarization
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SIGNING_KEYCHAIN: ${{ runner.temp }}/timi-signing.keychain
        run: |
          set -euo pipefail
          keychain="$MACOS_SIGNING_KEYCHAIN"
          intermediate="$RUNNER_TEMP/timi-developer-id-g2.cer"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer --output "$intermediate"
          security import "$intermediate" -k "$keychain"
          node scripts/signing-check.mjs
          xcrun notarytool store-credentials timi-notarization --keychain "$keychain" \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      - name: Version, package and publish GitHub release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_SIGNING_KEYCHAIN: ${{ runner.temp }}/timi-signing.keychain
      - name: Remove signing files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/timi-signing.p12" "$RUNNER_TEMP/timi-developer-id-g2.cer"
