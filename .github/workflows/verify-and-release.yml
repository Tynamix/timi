name: Verify and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR checks can stop; publishing a release must finish atomically.
concurrency:
  group: verify-and-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  release:
    name: Release macOS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24.10.0'
          cache: npm
      - run: npm ci
      - name: Version, package and publish GitHub release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
